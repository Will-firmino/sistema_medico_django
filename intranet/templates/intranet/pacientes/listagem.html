{% for paciente in pacientes %}
<tr>
  <td>{{ paciente.nome }} {{ paciente.sobrenome }}</td>
  <td>{{ paciente.email }}</td>
  <td>{{ paciente.telefone }}</td>
  <td>{{ paciente.cpf }}</td>
  <td>
    <a href="{% url 'intranet:paciente-update' paciente.pk %}">editar</a>
    <a href="{% url 'intranet:paciente-delete' paciente.pk %}">excluir</a>
  </td>
</tr>
{% empty %}
  <tr><td colspan="5">Nenhum paciente cadastrado.</td></tr>
{% endfor %}
