{% extends 'intranet/base.html' %}
<!-- extends: declara que este template herda de base.html -->
<!-- Tudo que não está em um {% block %} é ignorado — só blocos são usados -->

{% load static %}

{% block header %}
<!-- Sobrescreve o bloco header do pai — este é o cabeçalho para usuários logados -->
<header class="header">
  <div class="container header-container">
    <a class="logo" href="{% url 'intranet:home' %}">
      <img src="{% static 'intranet/assets/logo.svg' %}" alt="">
    </a>

    <div class="wrapper">
      <nav class="main-nav">

        <!-- Dropdown CADASTROS -->
        <ul class="nav-left">
          <li class="dropdown">  <!-- :hover mostra .dropdown-menu via CSS -->
            <a href="">CADASTROS <i class="arrow-down"></i></a>
            <ul class="dropdown-menu">
              <li><a href="{% url 'intranet:medico-list' %}">Médicos</a></li>
              <li><a href="{% url 'intranet:paciente-list' %}">Pacientes</a></li>
              <li><a href="{% url 'intranet:consulta-list' %}">Consultas</a></li>
            </ul>
          </li>
        </ul>

        <!-- Dropdown do usuário logado -->
        <ul class="nav-right">
          <li class="dropdown">
            <a href="">
              <!-- request.user: o usuário Django autenticado na sessão atual -->
              <!-- get_full_name: retorna "Nome Sobrenome"; se vazio, usa o username -->
              Olá, <span>{{ request.user.get_full_name|default:request.user.username }}</span>
              <!-- |default:X: filtro Django — usa X se o valor anterior for vazio -->
            </a>
            <ul class="dropdown-menu">
              <li>
                <!-- Logout deve ser POST (proteção CSRF) — não pode ser link GET -->
                <form method="post" action="{% url 'logout' %}">
                  {% csrf_token %}  <!-- token de segurança contra Cross-Site Request Forgery -->
                  <button type="submit">Sair</button>
                </form>
              </li>
            </ul>
          </li>
        </ul>

      </nav>
    </div>
  </div>
</header>
{% endblock %}
